apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: update-gitops-image-tag
  namespace: tekton-pipelines
spec:
  params:
    - name: git-url
      type: string
    - name: image-name
      type: string
    - name: new-tag
      type: string
    - name: gitops-path
      type: string
      default: k8s/overlays/production/kustomization.yaml
    - name: git-user-name
      type: string
      default: "Tekton CI"
    - name: git-user-email
      type: string
      default: "tekton@ci.internal"

  workspaces:
    - name: source

  volumes:
    - name: ssh-directory
      secret:
        secretName: git-ssh-credentials
        defaultMode: 0400

  steps:
    - name: update-and-push
      image: alpine/git:latest
      volumeMounts:
        - name: ssh-directory
          mountPath: /root/.ssh
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e

        git config --global user.name "$(params.git-user-name)"
        git config --global user.email "$(params.git-user-email)"

        # Use kustomize to update the image tag
        # This updates kustomization.yaml: images[name=$(image-name)].newTag
        cd $(workspaces.source.path)

        # Install kustomize
        wget -qO /usr/local/bin/kustomize \
          https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.2.1/kustomize_v5.2.1_linux_amd64.tar.gz
        chmod +x /usr/local/bin/kustomize

        OVERLAY_DIR="$(dirname $(params.gitops-path))"
        cd "$OVERLAY_DIR"

        kustomize edit set image \
          "$(params.image-name):$(params.new-tag)"

        git add kustomization.yaml
        git commit -m "ci: deploy $(params.image-name):$(params.new-tag)

        Triggered by Tekton pipeline build.
        ArgoCD will sync this change and start the canary rollout."

        git push origin HEAD
