# ──────────────────────────────────────────────────────────────────────────────
# App-of-Apps — bootstraps the entire platform from a single ArgoCD Application
# Apply once: kubectl apply -f gitops/argocd/app-of-apps.yaml -n argocd
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: release-on-demand-platform
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/org/release-on-demand-example.git
    targetRevision: main
    path: gitops/argocd              # contains all child Application manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
