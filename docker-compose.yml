name: release-on-demand

# ──────────────────────────────────────────────────────────────────────────────
# Local simulation of the full Release on Demand stack.
#
# Services:
#   app-stable   — stable version of Acme API (v1.0.0)
#   app-canary   — canary version of Acme API (v2.0.0), ~5% traffic
#   nginx        — traffic splitter (simulates Istio VirtualService)
#   unleash-db   — PostgreSQL for Unleash
#   unleash      — Feature flag management UI + API
#   prometheus   — Metrics collection + canary analysis queries
#   grafana      — Dashboards: canary analysis + flag status
#
# Access:
#   API (load-balanced): http://localhost:8080/api/products
#   Stable direct:       http://localhost:8081/api/products
#   Canary direct:       http://localhost:8082/api/products
#   Unleash UI:          http://localhost:4242  (admin / unleash4all)
#   Prometheus:          http://localhost:9090
#   Grafana:             http://localhost:3000  (admin / admin)
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── Stable version (v1) ───────────────────────────────────────────────────
  app-stable:
    build:
      context: ./app
      args:
        APP_VERSION: v1.0.0
    environment:
      APP_VERSION: v1.0.0
      PORT: "8080"
      UNLEASH_URL: "http://unleash:4242/api"
      UNLEASH_TOKEN: "*:*.unleash-insecure-api-token"
      NODE_ENV: production
    ports:
      - "8081:8080"
    depends_on:
      unleash:
        condition: service_healthy
    restart: unless-stopped
    labels:
      role: stable
      version: v1.0.0

  # ── Canary version (v2) ───────────────────────────────────────────────────
  app-canary:
    build:
      context: ./app
      args:
        APP_VERSION: v2.0.0
    environment:
      APP_VERSION: v2.0.0
      PORT: "8080"
      UNLEASH_URL: "http://unleash:4242/api"
      UNLEASH_TOKEN: "*:*.unleash-insecure-api-token"
      NODE_ENV: production
    ports:
      - "8082:8080"
    depends_on:
      unleash:
        condition: service_healthy
    restart: unless-stopped
    labels:
      role: canary
      version: v2.0.0

  # ── Nginx: Traffic Splitter ───────────────────────────────────────────────
  # Simulates Istio VirtualService weight-based routing.
  # Edit nginx/nginx.conf to change canary traffic percentage.
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app-stable
      - app-canary
    restart: unless-stopped

  # ── Unleash: Feature Flag Management ─────────────────────────────────────
  unleash-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: unleash
      POSTGRES_USER: unleash
      POSTGRES_PASSWORD: unleash
    volumes:
      - unleash-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "unleash"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  unleash:
    image: unleashorg/unleash-server:6
    ports:
      - "4242:4242"
    environment:
      DATABASE_URL: "postgresql://unleash:unleash@unleash-db/unleash"
      INIT_ADMIN_API_TOKENS: "*:*.unleash-insecure-api-token"
      LOG_LEVEL: warn
    depends_on:
      unleash-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4242/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  # ── Prometheus: Metrics + Canary Analysis Queries ────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus-config.yaml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
      - --web.enable-admin-api
    restart: unless-stopped

  # ── Grafana: Dashboards ───────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/release-on-demand.json
    volumes:
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  unleash-db-data:
  prometheus-data:
  grafana-data:
