# ── Traffic Splitter ──────────────────────────────────────────────────────────
# Simulates Istio VirtualService weight-based routing locally.
# Adjust weights to simulate canary progression:
#   stable=100, canary=0  →  no canary
#   stable=95,  canary=5  →  5% canary (initial)
#   stable=80,  canary=20 →  20% canary
#   stable=50,  canary=50 →  50% canary
#   stable=0,   canary=100→  full canary (promoted)

upstream acme_api_stable {
    server app-stable:8080;
}

upstream acme_api_canary {
    server app-canary:8080;
}

# Split block: weight-based routing (nginx 1.27+)
# Weights simulate the Istio VirtualService traffic percentages
split_clients "${remote_addr}${request_id}" $upstream_pool {
    95%   "stable";    # ← change these to simulate canary progression
    *     "canary";
}

server {
    listen 80;
    server_name localhost;

    # Main API — routes to stable or canary based on split_clients
    location /api/ {
        if ($upstream_pool = "stable") {
            proxy_pass http://acme_api_stable;
        }
        if ($upstream_pool = "canary") {
            proxy_pass http://acme_api_canary;
        }
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Canary-Version $upstream_pool;
        add_header X-Served-By $upstream_pool always;
    }

    # Health checks always go to stable
    location /health {
        proxy_pass http://acme_api_stable/health;
    }

    # Admin routes — always stable
    location /ready {
        proxy_pass http://acme_api_stable/ready;
    }
}
