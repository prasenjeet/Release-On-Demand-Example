name: Deploy

on:
  push:
    branches: [main]

# Only one deployment runs at a time; newer pushes cancel in-progress ones.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write  # needed to push to GHCR

    steps:
      - uses: actions/checkout@v4

      # ── Build & push image ──────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/app:latest
            ghcr.io/${{ github.repository }}/app:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      # ── Deploy (replace with your target: SSH, kubectl, fly.io, etc.) ───
      - name: Deploy to production
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Release on Demand — Deployment complete"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "  Image pushed:  ghcr.io/${{ github.repository }}/app:${{ github.sha }}"
          echo "  Commit:        ${{ github.sha }}"
          echo "  Branch:        ${{ github.ref_name }}"
          echo ""
          echo "  ✅ Code is deployed to production."
          echo ""
          echo "  ⚑  Features are NOT yet visible to users."
          echo "     Toggle flags in the admin panel to release them:"
          echo "     http://<your-host>:3000/admin"
          echo ""
          echo "  This is the essence of Release on Demand:"
          echo "  Deploy continuously. Release deliberately."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # ── Notify (optional) ────────────────────────────────────────────────
      # Uncomment and configure to send Slack / Teams notifications
      #
      # - name: Notify Slack
      #   uses: slackapi/slack-github-action@v1
      #   with:
      #     payload: |
      #       {
      #         "text": "🚀 Acme Shop deployed — features awaiting release in flag admin."
      #       }
      #   env:
      #     SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
