apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: acme-api-gateway
  namespace: production
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "api.acme.example.com"
      # Redirect all HTTP → HTTPS in production
      tls:
        httpsRedirect: true
    - port:
        number: 443
        name: https
        protocol: HTTPS
      hosts:
        - "api.acme.example.com"
      tls:
        mode: SIMPLE
        credentialName: acme-api-tls   # cert-manager TLS secret
