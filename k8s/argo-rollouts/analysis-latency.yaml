# ──────────────────────────────────────────────────────────────────────────────
# AnalysisTemplate: P99 Latency Gate
#
# Canary p99 latency must stay under 500ms.
# Also validates canary p99 is ≤ 1.2× stable's p99 (regression guard).
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: canary-latency-p99
  namespace: production
spec:
  args:
    - name: canary-service

  metrics:
    - name: latency-p99-absolute
      interval: 1m
      # P99 must be under 500ms
      successCondition: result[0] < 0.5
      failureLimit: 3
      provider:
        prometheus:
          address: http://prometheus-operated.monitoring.svc.cluster.local:9090
          query: |
            histogram_quantile(0.99,
              sum by (le) (
                rate(http_request_duration_seconds_bucket{
                  kubernetes_service_name="{{args.canary-service}}"
                }[5m])
              )
            )

    - name: latency-p99-vs-stable
      interval: 1m
      # Canary P99 must not be more than 20% worse than stable
      successCondition: result[0] <= 1.2
      failureLimit: 2
      provider:
        prometheus:
          address: http://prometheus-operated.monitoring.svc.cluster.local:9090
          query: |
            (
              histogram_quantile(0.99,
                sum by (le) (rate(http_request_duration_seconds_bucket{
                  kubernetes_service_name="{{args.canary-service}}"
                }[5m]))
              )
            ) / (
              histogram_quantile(0.99,
                sum by (le) (rate(http_request_duration_seconds_bucket{
                  kubernetes_service_name="acme-api-stable"
                }[5m]))
              )
            )
